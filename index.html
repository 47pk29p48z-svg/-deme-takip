<style>
  :root{
    --bg:#F2F2F4;
    --surface:#FFFFFF;
    --surface2:#F1F1F3;
    --line:#EAEAEC;
    --text:#131417;
    --muted:#8C8E94;
    --green:#1FA855;
    --amber:#E8A33D;
    --red:#E32227;
    --blue:#2D5BD1;
    --black:#131417;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --shadow:0 1px 2px rgba(20,20,25,0.05), 0 1px 8px rgba(20,20,25,0.05);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;}
  .app{max-width:1120px; margin:0 auto; padding:18px 14px 90px;}

  header.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
  header.top h1{font-size:27px; margin:0; font-weight:900; letter-spacing:-0.03em;}
  header.top .eyebrow{display:inline-block; font-size:11px; color:#fff; background:var(--red); letter-spacing:0.7px; text-transform:uppercase; font-weight:800; padding:5px 13px; border-radius:999px; margin-bottom:8px;}
  .headbtns{display:flex; gap:9px;}
  .iconbtn{width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; background:#fff; box-shadow:var(--shadow); color:var(--text);}
  .iconbtn.green{color:var(--green);} .iconbtn.red{color:var(--red);}

  .tabs{display:flex; gap:6px; background:var(--surface); padding:5px; border-radius:14px; box-shadow:var(--shadow); margin-bottom:14px;}
  .tabs button{flex:1; border:none; background:none; padding:10px 4px; border-radius:10px; font-family:var(--sans); font-weight:800; font-size:12.5px; color:var(--muted); cursor:pointer;}
  .tabs button.on{background:var(--black); color:#fff;}

  .banner{border-radius:12px; padding:11px 13px; font-size:12.5px; margin-bottom:12px; font-weight:600; line-height:1.45;}
  .banner.info{background:var(--surface2); border:1px solid var(--line); color:var(--muted);}
  .banner.warn{background:rgba(232,163,61,0.14); border:1px solid rgba(232,163,61,0.5); color:#8a5b0f;}
  .banner.danger{background:rgba(227,34,39,0.09); border:1px solid rgba(227,34,39,0.35); color:#9b1b1f;}
  .banner b{font-weight:900;}
  .banner button{margin-left:6px;}

  .grid-stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px;}
  .stat{background:var(--surface); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow);}
  .stat .label{font-size:11px; color:var(--muted); letter-spacing:0.9px; text-transform:uppercase; margin-bottom:8px; font-weight:800;}
  .stat.tappable{cursor:pointer;}

  button.editbtn{background:#fff; border:1.5px solid var(--line); color:var(--text); border-radius:999px; padding:8px 13px; font-size:11.5px; font-weight:800; cursor:pointer; font-family:var(--sans);}

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

  .student-list{display:flex; flex-direction:column; gap:9px;}
  .student-card{background:var(--surface); border-radius:16px; padding:13px 15px; box-shadow:var(--shadow);}
  .student-card-top{display:flex; align-items:center; gap:11px; cursor:pointer;}
  .student-card-info{flex:1; min-width:0;}

  .student-card-sub{font-size:11.5px; color:var(--muted); font-weight:700; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .avatar{width:34px; height:34px; min-width:34px; border-radius:50%; background:var(--surface2); color:var(--muted); display:inline-flex; align-items:center; justify-content:center; font-weight:900; font-size:12px;}
  .cardactions{display:flex; gap:6px; align-items:center; margin-top:10px;}

  .histbox{background:var(--surface2); border-radius:12px; padding:10px 12px; margin:8px 0 2px;}
  .hrow{display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--line); font-weight:700;}

  .overlay{position:fixed; inset:0; background:rgba(10,10,12,0.55); display:flex; align-items:center; justify-content:center; z-index:60; padding:14px;}

  .twocol{display:flex; gap:8px;} .twocol > *{flex:1; min-width:0;}

  .toast button{background:none; border:none; color:#fff; font-weight:900; font-size:13px; text-decoration:underline; cursor:pointer; font-family:var(--sans); white-space:nowrap;}

  .cal-cell.on{background:#fff; border-color:var(--black);}
  .cal-cell .m{font-size:11px; font-weight:900; color:var(--muted); margin-bottom:3px;}
  .cal-cell .a{font-size:11px; font-weight:800; color:var(--text);}
  .cal-cell.today .m{color:var(--blue);}

  .tx-row{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:13px;}

  .tx-row .d{font-size:11px; color:var(--muted); font-weight:700; width:52px; flex:0 0 auto;}
  .tx-row .t{flex:1; min-width:0;}
  .tx-row .t .c{font-weight:800;}
  .tx-row .t .n{font-size:11.5px; color:var(--muted); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  footer.note{text-align:center; color:var(--muted); font-size:11px; margin-top:20px; font-weight:600; line-height:1.6;}
  @media(min-width:760px){ .grid-stats{grid-template-columns:repeat(4,1fr);} }

  #printArea{display:none;}

    body{background:#fff;}

<body>
<div class="app" id="app"></div>
<div id="printArea"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" onchange="handleImportFile(event)">
<script>
/* ===================== storage ===================== */
const KEYS = {
  students:'coach_students_v3',
  payments:'coach_payments_v3',
  installments:'coach_installments_v1',
  expensesOld:'coach_expenses_v1',
  expenses:'coach_expenses_v2',
  other:'coach_other_income_v1',
  cats:'coach_expense_cats_v1',
  meta:'coach_meta_v1'
};
const BACKUP_VERSION = 2;

const STORAGE_OK = (function(){
  try{ const t='__t__'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return true; }catch(e){ return false; }
})();
function getList(key){
  if(!STORAGE_OK) return (window.__mem && window.__mem[key]) || [];
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : []; }
  catch(e){ console.error('okuma hatası', e); return []; }
}
function saveList(key, list){
  if(!STORAGE_OK){ window.__mem = window.__mem||{}; window.__mem[key]=list; return true; }
  try{ localStorage.setItem(key, JSON.stringify(list)); return true; }
  catch(e){ console.error('yazma hatası', e); showAlert('Kayıt yapılamadı — tarayıcı depolaması dolu veya kapalı olabilir. Verinizi kaybetmemek için hemen Rapor sekmesinden yedek alın.'); return false; }
}
function getObj(key, fallback){
  if(!STORAGE_OK) return (window.__memo && window.__memo[key]) || fallback;
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; }
}
function saveObj(key, obj){
  if(!STORAGE_OK){ window.__memo = window.__memo||{}; window.__memo[key]=obj; return true; }
  try{ localStorage.setItem(key, JSON.stringify(obj)); return true; }catch(e){ return false; }
}

/* ===================== state ===================== */
let students = [], payments = [], installments = [], expenses = [], otherIncomes = [];
let expenseCats = [];
let meta = {lastBackupAt:null, pin:null};
let ready = false, locked = false;

let panelOpen = {gider:false, rapor:false, odemeler:false, taksit:false};
let otherPaymentsOpen = false;
let settingsOpen = false;
let searchQ = '', filterMode = 'all', sortMode = 'name';
let detailStudentId = null;       // öğrenci dosyası
let detailTab = 'ozet';
let kasaMonth = null;             // 'YYYY-MM'
let kasaYear = new Date().getFullYear();
let monthOpen = {};
let menuState = null;             // {x,y,items}
let confirmState = null, alertState = null, toastState = null, toastTimer = null;
let collectState = null;          // tahsilat modalı
let addModalOpen = false, editingStudentId = null, editingPaymentId = null;
let installmentModalStudentId = null, editingInstallmentId = null, creditModalStudentId = null;
let expenseModal = null, incomeModal = null, textBackupOpen = false, textImportOpen = false, pinModalOpen = false;
let instRows = [];

const DEFAULT_CATS = [
  {key:'kart', label:'Kredi Kartı'},
  {key:'kira', label:'Kira'},
  {key:'fatura', label:'Fatura'},
  {key:'vergi', label:'Vergi'},
  {key:'ulasim', label:'Ulaşım'},
  {key:'diger', label:'Diğer'}
];
const MONTH_SHORT = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];

/* ===================== utils ===================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function currentMonthKey(){ return todayStr().slice(0,7); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtShort(d){ if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd} ${MONTH_SHORT[Number(m)-1]}`; }
function fmtMoney(n){ return (Math.round(Number(n)||0)).toLocaleString('tr-TR')+' ₺'; }
function initials(name){ return (name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }
function monthKey(d){ return (d||'').slice(0,7); }
function monthLabel(key){ const [y,m]=key.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'}); }
function isThisMonth(d){ return monthKey(d)===currentMonthKey(); }
function inMonth(d, mk){ return monthKey(d)===mk; }
function daysBetween(dateStr){ return Math.round((new Date(dateStr+'T00:00:00') - new Date(todayStr()+'T00:00:00'))/86400000); }
function addMonths(mk, delta){ const [y,m]=mk.split('-').map(Number); const d=new Date(y,m-1+delta,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function catLabel(key){ const c = expenseCats.find(x=>x.key===key); return c ? c.label : key; }

/* ===================== load & migrate ===================== */
function loadAll(){
  students = getList(KEYS.students);
  payments = getList(KEYS.payments);
  installments = getList(KEYS.installments);
  otherIncomes = getList(KEYS.other);
  expenseCats = getList(KEYS.cats);
  if(!expenseCats.length){ expenseCats = DEFAULT_CATS.slice(); saveList(KEYS.cats, expenseCats); }
  expenses = getList(KEYS.expenses);
  const old = getList(KEYS.expensesOld);
  if(!expenses.length && old.length){
    // eski {month,category,amount} kutuları → tarihli işlemlere çevir
    expenses = old.filter(e=>Number(e.amount)>0).map(e=>({
      id: e.id || uid(),
      date: (e.month||currentMonthKey())+'-01',
      category: e.category,
      amount: Number(e.amount)||0,
      desc: 'Aylık toplam (eski kayıttan aktarıldı)',
      createdAt: e.createdAt || new Date().toISOString()
    }));
    saveList(KEYS.expenses, expenses);
  }
  meta = getObj(KEYS.meta, {lastBackupAt:null, pin:null});
  locked = !!meta.pin;
  ready = true;
  render();
}
function saveStudents(){ saveList(KEYS.students, students); }
function savePayments(){ saveList(KEYS.payments, payments); }
function saveInstallments(){ saveList(KEYS.installments, installments); }
function saveExpenses(){ saveList(KEYS.expenses, expenses); }
function saveOther(){ saveList(KEYS.other, otherIncomes); }
function saveMeta(){ saveObj(KEYS.meta, meta); }
function saveAll(){ saveStudents(); savePayments(); saveInstallments(); saveExpenses(); saveOther(); saveList(KEYS.cats, expenseCats); }

/* ===================== undo ===================== */
function snapshot(){ return JSON.stringify({students, payments, installments, expenses, otherIncomes}); }
function restoreSnapshot(snap){
  const d = JSON.parse(snap);
  students=d.students; payments=d.payments; installments=d.installments; expenses=d.expenses; otherIncomes=d.otherIncomes;
  saveAll(); render();
}
function withUndo(label, fn){
  const snap = snapshot();
  fn();
  showToast(label, ()=>restoreSnapshot(snap));
}
function showToast(label, undoFn){
  toastState = {label, undoFn};
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastState=null; renderToast(); }, 10000);
  renderToast();
}
function undoNow(){
  const fn = toastState && toastState.undoFn;
  toastState = null; if(toastTimer) clearTimeout(toastTimer);
  renderToast();
  if(fn) fn();
}
function renderToast(){
  const ex = document.getElementById('undoToast'); if(ex) ex.remove();
  if(!toastState) return;
  const d = document.createElement('div');
  d.id='undoToast'; d.className='toast';
  d.innerHTML = `<span>${esc(toastState.label)}</span><button onclick="undoNow()">Geri al</button>`;
  document.body.appendChild(d);
}

/* ===================== derived data ===================== */
function studentPayments(sid){
  return payments.filter(p=>p.studentId===sid).sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||'').localeCompare(a.createdAt||''));
}
function studentTotal(sid){ return payments.filter(p=>p.studentId===sid).reduce((s,p)=>s+Number(p.amount||0),0); }
function studentInstallments(sid){ return installments.filter(i=>i.studentId===sid).sort((a,b)=> a.dueDate.localeCompare(b.dueDate)); }
function pendingInstallments(){ return installments.filter(i=>!i.paid).sort((a,b)=> a.dueDate.localeCompare(b.dueDate)); }
function installmentStatus(i){
  if(i.paid) return 'paid';
  const d = daysBetween(i.dueDate);
  if(d < 0) return 'overdue';
  if(d <= 7) return 'upcoming';
  return 'scheduled';
}
function statusLabel(s){ return s==='overdue'?'Gecikti':(s==='upcoming'?'Bu hafta':(s==='paid'?'Ödendi':'Planlandı')); }
function statusClass(s){ return s==='overdue'?'unpaid':(s==='upcoming'?'pending2':(s==='paid'?'paid':'never')); }
function memberNameOf(sid, fallback){ const s = students.find(x=>x.id===sid); return s ? s.name : (fallback ? fallback + ' (silinmiş)' : '(silinmiş öğrenci)'); }
function paidInMonth(sid, mk){ return payments.some(p=>p.studentId===sid && inMonth(p.date, mk)); }
function hasOverdue(sid){ return installments.some(i=>i.studentId===sid && !i.paid && installmentStatus(i)==='overdue'); }

function monthIncome(mk){
  const st = payments.filter(p=>inMonth(p.date,mk)).reduce((s,p)=>s+Number(p.amount||0),0);
  const ot = otherIncomes.filter(o=>inMonth(o.date,mk)).reduce((s,o)=>s+Number(o.amount||0),0);
  return {student:st, other:ot, total:st+ot};
}
function monthExpense(mk){ return expenses.filter(e=>inMonth(e.date,mk)).reduce((s,e)=>s+Number(e.amount||0),0); }
function expectedThisMonth(){
  return students.filter(s=> (s.rhythm||'aylik')==='aylik').reduce((s,st)=>s+Number(st.price||0),0);
}
function unpaidStudents(mk){
  return students.filter(s=> !paidInMonth(s.id, mk)).sort((a,b)=>a.name.localeCompare(b.name,'tr'));
}
function globalStats(){
  const mk = currentMonthKey();
  const inc = monthIncome(mk);
  const exp = monthExpense(mk);
  const unpaid = unpaidStudents(mk);
  const pend = pendingInstallments();
  return {
    mk, inc, exp, net: inc.total-exp,
    expected: expectedThisMonth(),
    paidCount: students.length - unpaid.length,
    unpaid,
    totalAll: payments.reduce((s,p)=>s+Number(p.amount||0),0),
    otherAll: otherIncomes.reduce((s,o)=>s+Number(o.amount||0),0),
    pending: pend,
    overdue: pend.filter(i=>installmentStatus(i)==='overdue'),
    upcoming: pend.filter(i=>installmentStatus(i)==='upcoming'),
    pendingTotal: pend.reduce((s,i)=>s+Number(i.amount||0),0),
    debtors: students.filter(s=>Number(s.debt)>0),
    debtorsTotal: students.reduce((s,st)=>s+Number(st.debt||0),0)
  };
}
function backupAgeDays(){
  if(!meta.lastBackupAt) return null;
  return Math.floor((Date.now() - new Date(meta.lastBackupAt).getTime())/86400000);
}

/* ===================== render shell ===================== */
function render(){
  const app = document.getElementById('app');
  if(!ready){ app.innerHTML = '<p class="empty" style="text-align:center;padding:40px;">Yükleniyor…</p>'; return; }
  if(locked){ renderLock(); return; }
  const g = globalStats();
  let h = `
  <header class="top">
    <div><div class="eyebrow">Kişisel Koçluk</div><h1>Ödeme Takip</h1></div>
    <div class="headbtns">
      <button class="iconbtn green" onclick="exportBackup()" title="Yedeği indir" aria-label="Yedeği indir">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg></button>
      <button class="iconbtn red" onclick="document.getElementById('importFile').click()" title="Yedeği geri yükle" aria-label="Yedeği geri yükle">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V5"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></svg></button>
      <button class="iconbtn" onclick="openSettings()" title="Ayarlar" aria-label="Ayarlar">

function statCard(label, value, o){
  o = o||{};
  return `<div class="stat ${o.click?'tappable':''}" ${o.click? `onclick="${o.click}"`:''}>
    <div class="label">${label}</div>
    <div class="value ${o.tone||''}"${o.small? ' style="font-size:22px;"':''}>${value}</div>
    ${o.sub? `<div class="substat">${o.sub}</div>`:''}
    ${o.sub2? `<div class="substat">${o.sub2}</div>`:''}
  </div>`;
}
function viewHome(g){
  const pct = g.expected>0 ? Math.round(g.inc.student/g.expected*100) : 0;
  const expCount = expenses.filter(e=>inMonth(e.date,g.mk)).length;
  let h = `<div class="grid-stats">
    ${statCard('Bu ay ödeyen', g.paidCount, {tone:'green'})}
    ${statCard('Bu ay ödemeyen', g.unpaid.length, {tone:g.unpaid.length?'red':'', click:'goUnpaidList()'})}
    ${statCard('Öğrenci', students.length, {})}
    ${statCard('Bu ay tahsilat', fmtMoney(g.inc.total), {small:true, tone:'green', sub:`Öğrenci ${fmtMoney(g.inc.student)}`, sub2:`Diğer ${fmtMoney(g.inc.other)}`})}
    ${statCard('Bu ay gider', fmtMoney(g.exp), {small:true, tone:'red', sub:`${expCount} işlem · ${panelOpen.gider?'gizle':'aç'}`, click:"togglePanel('gider')"})}
    ${statCard('Bu ay net', fmtMoney(g.net), {small:true, tone:g.net>=0?'green':'red', sub:`Beklenen ${fmtMoney(g.expected)} · %${pct}`, click:"togglePanel('rapor')"})}
    ${statCard('Toplam tahsilat', fmtMoney(g.totalAll+g.otherAll), {small:true, tone:'green', sub:`Ödeme kayıtları · ${panelOpen.odemeler?'gizle':'aç'}`, click:"togglePanel('odemeler')"})}
    ${statCard('Bekleyen taksit', fmtMoney(g.pendingTotal), {small:true, sub:`${g.pending.length} açık`, click:"togglePanel('taksit')"})}
  </div>`;

  if(g.overdue.length){
    h += `<div class="banner danger"><b>${g.overdue.length} taksit gecikti</b> — toplam ${fmtMoney(g.overdue.reduce((s,i)=>s+Number(i.amount||0),0))}. ${esc(g.overdue.slice(0,3).map(i=>memberNameOf(i.studentId)).join(', '))}${g.overdue.length>3?' ve diğerleri':''}.</div>`;

    h += `<div class="banner warn"><b>${g.upcoming.length} taksitin vadesi bu hafta</b> — ${esc(g.upcoming.slice(0,3).map(i=>memberNameOf(i.studentId)+' '+fmtShort(i.dueDate)).join(', '))}.</div>`;

  if(g.debtors.length){
    h += `<section class="panel"><h2 style="margin-bottom:8px;">Kredili öğrenciler <span class="count">(${g.debtors.length} kişi · ${fmtMoney(g.debtorsTotal)})</span></h2>

/* ===================== ÖĞRENCİLER ===================== */
function filteredStudents(){
  const mk = currentMonthKey();
  const q = searchQ.trim().toLocaleLowerCase('tr');
  let list = students.filter(s=>{
    if(q && !(s.name||'').toLocaleLowerCase('tr').includes(q) && !(s.phone||'').includes(q)) return false;
    if(filterMode==='unpaid') return !paidInMonth(s.id, mk);
    if(filterMode==='overdue') return hasOverdue(s.id);
    if(filterMode==='debt') return Number(s.debt)>0;
    if(filterMode==='never') return studentPayments(s.id).length===0;
    return true;
  });
  const lastDate = s=>{ const p=studentPayments(s.id)[0]; return p? p.date : '0000-00-00'; };
  if(sortMode==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  if(sortMode==='last') list.sort((a,b)=> lastDate(b).localeCompare(lastDate(a)));
  if(sortMode==='debt') list.sort((a,b)=> (Number(b.debt)||0)-(Number(a.debt)||0));
  if(sortMode==='overdue') list.sort((a,b)=> (hasOverdue(b)?1:0)-(hasOverdue(a)?1:0) || a.name.localeCompare(b.name,'tr'));
  return list;
}
function viewOgrenciler(){
  const chip = (k,l)=>`<button class="chip ${filterMode===k?'on':''}" onclick="setFilter('${k}')">${l}</button>`;
  return `<div class="toolbar">
    <input type="text" id="searchInput" placeholder="Öğrenci ara…" value="${esc(searchQ)}" oninput="onSearch(this.value)">
    <button class="primary" onclick="openAddModal()">+ Kişi ekle</button>
  </div>
  <div class="chips">
    ${chip('all','Tümü')}${chip('unpaid','Bu ay ödemeyen')}${chip('overdue','Geciken')}${chip('debt','Kredili')}${chip('never','Kayıtsız')}
    <select class="sortsel" onchange="setSort(this.value)">
      <option value="name" ${sortMode==='name'?'selected':''}>İsme göre</option>
      <option value="last" ${sortMode==='last'?'selected':''}>Son ödemeye göre</option>
      <option value="debt" ${sortMode==='debt'?'selected':''}>Borca göre</option>
      <option value="overdue" ${sortMode==='overdue'?'selected':''}>Gecikmeye göre</option>
    </select>

}
function studentListHtml(){
  const list = filteredStudents();
  if(!students.length) return `<div class="panel"><div class="empty" style="text-align:center;">Henüz öğrenci yok. “+ Kişi ekle” ile başlayın; ders ücretini girdiğinizde tahsilat tek dokunuşa iner.</div></div>`;
  if(!list.length) return `<div class="panel"><div class="empty" style="text-align:center;">Bu filtreye uyan öğrenci yok.</div></div>`;
  return list.map(s=>{
    const hist = studentPayments(s.id);
    const last = hist[0];
    const paidNow = last && isThisMonth(last.date);
    let badge = `<span class="badge never">Kayıt yok</span>`;
    if(last) badge = paidNow ? `<span class="badge paid">Bu ay ödedi</span>` : `<span class="badge unpaid">Bu ay ödemedi</span>`;
    const pend = studentInstallments(s.id).filter(i=>!i.paid);
    const over = pend.filter(i=>installmentStatus(i)==='overdue');
    const sub = [
      fmtMoney(s.price)+' ders ücreti',
      s.lessonDay ? esc(s.lessonDay) : null,
      (s.rhythm==='paket' && s.packageRemaining!=null) ? `${s.packageRemaining} ders kaldı` : null
    ].filter(Boolean).join(' · ');
    return `<div class="student-card">
      <div class="student-card-top" onclick="openDetail('${s.id}')">
        <span class="avatar">${esc(initials(s.name))}</span>
        <div class="student-card-info">
          <div class="student-card-name">${esc(s.name)}</div>
          <div class="student-card-sub">${sub}</div>
        </div>
        ${badge}
      </div>
      ${last? `<div class="student-card-last">Son ödeme: ${fmtDate(last.date)} · ${fmtMoney(last.amount)}</div>`:''}
      ${(over.length || Number(s.debt)>0) ? `<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
        ${over.length? `<span class="badge unpaid">${over.length} taksit gecikti</span>`:''}
        ${Number(s.debt)>0? `<span class="badge debt">Borç ${fmtMoney(s.debt)}</span>`:''}
        ${pend.length && !over.length? `<span class="badge pending2">${pend.length} taksit bekliyor</span>`:''}
      </div>`:''}
      <div class="cardactions">
        <button class="paidbtn" onclick="openCollect('${s.id}')">Tahsil et</button>
        <button class="editbtn" onclick="openDetail('${s.id}')">Dosya</button>
        <div class="spacer"></div>
        <button class="editbtn" onclick="openStudentMenu(event,'${s.id}')" aria-label="Diğer işlemler">⋯</button>
      </div>
    </div>`;
  }).join('');
}

  searchQ = v;
  const el = document.getElementById('studentList');

function setFilter(k){ filterMode = k; render(); }

function openStudentMenu(ev, sid){
  ev.stopPropagation();
  const wasOpenFor = menuState && menuState.sid;
  if(menuState) closeMenu();
  if(wasOpenFor === sid) return;   // aynı butona ikinci basış menüyü kapatır
  const r = ev.currentTarget.getBoundingClientRect();
  const sx = window.pageXOffset || document.documentElement.scrollLeft || 0;
  const sy = window.pageYOffset || document.documentElement.scrollTop || 0;
  const vw = document.documentElement.clientWidth || window.innerWidth;
  // belge koordinatları: menü sayfayla birlikte kayar
  menuState = {x: Math.max(8, Math.min(r.left, vw-210)) + sx, y: r.bottom + 6 + sy, yTop: r.top + sy, sid};
  renderMenu();
}
function closeMenu(){ menuState=null; const m=document.getElementById('ctxMenu'); if(m) m.remove(); document.removeEventListener('click', closeMenu); }
function renderMenu(){
  const ex = document.getElementById('ctxMenu'); if(ex) ex.remove();
  if(!menuState) return;
  const sid = menuState.sid;
  const d = document.createElement('div');
  d.id='ctxMenu'; d.className='menu';
  d.style.left = menuState.x+'px'; d.style.top = menuState.y+'px';
  d.innerHTML = `
    <button onclick="closeMenu();openEditModal('${sid}')">Bilgileri düzenle</button>
    <button onclick="closeMenu();openInstallmentModal('${sid}')">Taksit planla</button>
    <button onclick="closeMenu();openCreditModal('${sid}')">Kredi (eksi bakiye) tanımla</button>
    <button onclick="closeMenu();printStatement('${sid}')">Ekstre yazdır</button>
    <button class="danger" onclick="closeMenu();deleteStudent('${sid}')">Öğrenciyi sil</button>`;
  document.body.appendChild(d);
  ensureMenuVisible(d);
  setTimeout(()=>document.addEventListener('click', closeMenu), 0);
}
/* Menü ekranın altına taşıyorsa sayfayı kadarınca yukarı kaydır;
   kaydıracak yer yoksa menüyü butonun üstüne aç. */
function ensureMenuVisible(d){
  if(!menuState) return;
  const h = d.offsetHeight || 220;
  const vh = window.innerHeight || (document.documentElement && document.documentElement.clientHeight) || 0;
  const sy = window.pageYOffset || document.documentElement.scrollTop || 0;
  const docH = Math.max(
    document.documentElement ? document.documentElement.scrollHeight : 0,
    document.body ? document.body.scrollHeight : 0
  );
  const margin = 12;
  const overflow = (menuState.y + h) - (sy + vh - margin);
  if(overflow <= 0) return;
  const canScroll = Math.max(0, docH - vh - sy);
  if(canScroll >= overflow){
    scrollByY(overflow);
    return;
  }
  const above = menuState.yTop - 6 - h;
  if(above >= sy + margin){
    menuState.y = above;
    d.style.top = above+'px';
    return;
  }
  if(canScroll > 0) scrollByY(canScroll);
}
function scrollByY(dy){
  try{ window.scrollBy({top:dy, behavior:'smooth'}); }
  catch(e){ if(window.scrollBy) window.scrollBy(0, dy); }
}

function openCollect(sid){
  const s = students.find(x=>x.id===sid); if(!s) return;
  const pend = studentInstallments(sid).filter(i=>!i.paid);
  collectState = {
    sid,
    date: todayStr(),
    amount: s.price || '',
    installmentId: '',
    debtApply: Number(s.debt)>0 ? Math.min(Number(s.debt), Number(s.price)||0) : 0,
    lessons: s.rhythm==='paket' ? '' : '',
    note: '',
    pend
  };
  render();
}
function closeCollect(){ collectState=null; const o=document.getElementById('collectOverlay'); if(o) o.remove(); }
function syncCollect(){
  if(!collectState) return;
  const g = id => document.getElementById(id);
  if(g('c_date')) collectState.date = g('c_date').value;
  if(g('c_amount')) collectState.amount = g('c_amount').value;
  if(g('c_inst')) collectState.installmentId = g('c_inst').value;
  if(g('c_debt')) collectState.debtApply = g('c_debt').value;
  if(g('c_lessons')) collectState.lessons = g('c_lessons').value;
  if(g('c_note')) collectState.note = g('c_note').value;
}
function onCollectInstChange(){
  syncCollect();
  const i = installments.find(x=>x.id===collectState.installmentId);
  if(i){ collectState.amount = i.amount; }
  renderCollectModal();
}
function renderCollectModal(){
  if(!collectState) return;
  const s = students.find(x=>x.id===collectState.sid);
  if(!s){ collectState=null; return; }
  const ex = document.getElementById('collectOverlay'); if(ex) ex.remove();
  const mk = monthKey(collectState.date || todayStr());
  const already = payments.filter(p=>p.studentId===s.id && inMonth(p.date, mk));
  const div = document.createElement('div');
  div.id='collectOverlay'; div.className='overlay';
  div.onclick=(e)=>{ if(e.target===div) closeCollect(); };
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <h3>Tahsilat — ${esc(s.name)}</h3>
    ${already.length? `<div class="banner warn" style="margin-bottom:12px;">Bu ay ${esc(s.name)} için zaten ${already.length} tahsilat kayıtlı (${already.map(p=>fmtMoney(p.amount)).join(', ')}). Yine de eklemek istiyorsanız devam edin.</div>`:''}
    <div class="twocol">
      <div class="field"><label>Tarih</label><input type="date" id="c_date" value="${esc(collectState.date)}" onchange="syncCollect();renderCollectModal()"></div>
      <div class="field"><label>Tutar (₺)</label><input type="number" min="0" inputmode="decimal" id="c_amount" value="${esc(collectState.amount)}"></div>
    </div>
    ${collectState.pend.length? `<div class="field"><label>Hangi taksiti kapatıyor?</label>
      <select id="c_inst" onchange="onCollectInstChange()">
        <option value="">Taksit değil — normal ders ücreti</option>
        ${collectState.pend.map(i=>`<option value="${i.id}" ${collectState.installmentId===i.id?'selected':''}>${esc(i.note||'Taksit')} · ${fmtDate(i.dueDate)} · ${fmtMoney(i.amount)}</option>`).join('')}
      </select></div>`:''}
    ${Number(s.debt)>0? `<div class="field"><label>Borçtan düşülecek tutar (₺)</label>
      <input type="number" min="0" inputmode="decimal" id="c_debt" value="${esc(collectState.debtApply)}">
      <div class="hint">Açık borç ${fmtMoney(s.debt)}. Buraya yazdığınız kadarı borçtan düşülür, kalan tutar normal tahsilat olarak işlenir. Borcu kapatmak istemiyorsanız 0 yazın.</div></div>`:''}
    ${s.rhythm==='paket'? `<div class="field"><label>Eklenecek ders hakkı (opsiyonel)</label><input type="number" min="0" id="c_lessons" value="${esc(collectState.lessons)}" placeholder="Örn: 8"></div>`:''}
    <div class="field"><label>Açıklama (opsiyonel)</label><input type="text" id="c_note" value="${esc(collectState.note)}" placeholder="Örn: Ekim ders ücreti"></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeCollect()">Vazgeç</button>
      <button class="primary" onclick="submitCollect()">Tahsilatı kaydet</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
function submitCollect(){
  syncCollect();
  const s = students.find(x=>x.id===collectState.sid); if(!s) return;
  const amount = Number(collectState.amount||0);
  const date = collectState.date;
  if(!date){ showAlert('Tahsilat tarihini girin.'); return; }
  if(!amount || amount<=0){ showAlert('Geçerli bir tutar girin.'); return; }
  const debtApply = Math.min(Number(collectState.debtApply||0), Number(s.debt||0), amount);
  const inst = collectState.installmentId ? installments.find(i=>i.id===collectState.installmentId) : null;
  const lessons = Number(collectState.lessons||0);
  const noteParts = [];
  if(collectState.note) noteParts.push(collectState.note);
  if(inst) noteParts.push(inst.note || 'Taksit');
  if(debtApply>0) noteParts.push(`Borçtan düşülen ${fmtMoney(debtApply)}`);

  const snap = snapshot();
  payments.push({
    id:uid(), studentId:s.id, amount, date,
    note: noteParts.join(' · ') || null,
    installmentId: inst? inst.id : null,
    debtApplied: debtApply>0? debtApply : null,
    createdAt:new Date().toISOString()
  });
  if(inst){ inst.paid = true; inst.paidDate = date; saveInstallments(); }
  if(debtApply>0){
    s.debt = Math.max(0, Number(s.debt||0) - debtApply);
    if(!s.debt){ s.debt = null; s.debtDate = null; }
    saveStudents();
  }
  if(lessons>0){
    s.packageRemaining = (Number(s.packageRemaining)||0)+lessons;
    s.packageTotal = (Number(s.packageTotal)||0)+lessons;
    saveStudents();
  }
  savePayments();
  closeCollect();
  render();
  showToast(`${fmtMoney(amount)} tahsilat kaydedildi.`, ()=>restoreSnapshot(snap));
}

  if(catTotals.length){
    h += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);">

  otherIncomes.forEach(o=>set.add(monthKey(o.date)));
  expenses.forEach(e=>set.add(monthKey(e.date)));
  set.add(currentMonthKey());
  return Array.from(set).filter(Boolean).sort().reverse();
}

let instStudentExpanded = {};
function toggleInstStudent(sid){ instStudentExpanded[sid] = !instStudentExpanded[sid]; render(); }
function renderInstallmentList(list){
  if(!list.length) return `<div class="empty">Bekleyen taksit yok.</div>`;
  const groups = {};
  list.forEach(i=>{ (groups[i.studentId] = groups[i.studentId]||[]).push(i); });
  return Object.keys(groups).map(sid=>{
    const items = groups[sid].slice().sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
    const total = items.reduce((s,i)=>s+Number(i.amount||0),0);
    const worst = items.some(i=>installmentStatus(i)==='overdue') ? 'overdue' : (items.some(i=>installmentStatus(i)==='upcoming') ? 'upcoming' : 'scheduled');
    const open = !!instStudentExpanded[sid];
    let out = `<div class="row-item" style="cursor:pointer;" onclick="toggleInstStudent('${sid}')">
      <div><div class="name">${esc(memberNameOf(sid))}</div><div class="sub">${items.length} taksit · ${fmtMoney(total)} · ilk vade ${fmtShort(items[0].dueDate)}</div></div>
      <div style="display:flex;gap:8px;align-items:center;"><span class="badge ${statusClass(worst)}">${statusLabel(worst)}</span></div>
    </div>`;
    if(open){
      out += `<div class="histbox">${items.map(i=>{
        const st = installmentStatus(i);
        return `<div class="hrow"><span class="grow">${fmtDate(i.dueDate)}${i.note? ' · '+esc(i.note):''}</span><span>${fmtMoney(i.amount)}</span>
        <span style="display:flex;gap:8px;align-items:center;"><span class="badge ${statusClass(st)}" style="font-size:10px;">${statusLabel(st)}</span>
        <button class="linklike" onclick="event.stopPropagation();markInstallmentPaid('${i.id}')">Ödendi</button>
        <button class="linklike" onclick="event.stopPropagation();openEditInstallmentModal('${i.id}')">Düzenle</button>
        <button class="del" onclick="event.stopPropagation();deleteInstallment('${i.id}')">Sil</button></span></div>`;
      }).join('')}</div>`;
    }
    return out;
  }).join('');
}

function addInstallmentRow(){
  syncInstRows();

  }
  instRows.push({id:uid(), amount:'', date:sug});

function submitInstallment(){
  syncInstRows();
  const sid = installmentModalStudentId;
  const upfront = Number(instRows._upfront||0);
  const valid = instRows.filter(r=>Number(r.amount)>0);
  if(!upfront && !valid.length){ showAlert('Peşinat veya en az bir taksit satırı girin.'); return; }
  if(valid.some(r=>!r.date)){ showAlert('Tutar girilen her satır için vade tarihi de gerekli.'); return; }
  if(upfront>0){
    payments.push({id:uid(), studentId:sid, amount:upfront, date:todayStr(), note:'Peşinat', createdAt:new Date().toISOString()});
    savePayments();
  }
  valid.forEach((r,idx)=>{
    installments.push({id:uid(), studentId:sid, amount:Number(r.amount), dueDate:r.date, paid:false, paidDate:null, note:`${idx+1}. taksit`, createdAt:new Date().toISOString()});
  });
  if(valid.length) saveInstallments();
  const s = students.find(x=>x.id===sid); if(s && s.rhythm!=='taksit'){ s.rhythm='taksit'; saveStudents(); }
  closeInstallmentModal(); render();
}

/* ===================== yedekleme ===================== */
function backupPayload(){
  return {
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    students, payments, installments, expenses, otherIncomes,
    expenseCats
  };
}
function markBackedUp(){ meta.lastBackupAt = new Date().toISOString(); saveMeta(); }
function exportBackup(){
  try{
    const blob = new Blob([JSON.stringify(backupPayload(),null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='odeme-takip-yedek-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    markBackedUp(); render();
    showToast('Yedek dosyası indirildi.', null);
  }catch(e){
    showAlert('Dosya indirilemedi. Bunun yerine yedeği metin olarak kopyalayabilirsiniz.');
    openTextBackupModal();
  }
}
function openTextBackupModal(){ textBackupOpen=true; render(); }
function closeTextBackupModal(){ textBackupOpen=false; const o=document.getElementById('textBackupOverlay'); if(o) o.remove(); }
function renderTextBackupModal(){
  const ex = document.getElementById('textBackupOverlay'); if(ex) ex.remove();
  const json = JSON.stringify(backupPayload());
  const div = document.createElement('div'); div.id='textBackupOverlay'; div.className='overlay';
  div.onclick=(e)=>{ if(e.target===div) closeTextBackupModal(); };
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <h3>Yedek metni</h3>
    <p class="empty" style="padding-top:0;">Metnin tamamını kopyalayıp Notlar’a veya kendinize göndereceğiniz bir mesaja kaydedin. Geri yüklemek için “Metinden geri yükle” bölümüne yapıştırın.</p>
    <textarea id="backupTextArea" readonly style="width:100%;height:150px;font-family:var(--mono);font-size:11px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);">${esc(json)}</textarea>
    <div class="modal-actions"><button class="secondary" onclick="closeTextBackupModal()">Kapat</button><button class="primary" onclick="copyBackupText()">Kopyala</button></div>
  </div>`;
  document.body.appendChild(div);
}
function copyBackupText(){
  const ta = document.getElementById('backupTextArea');
  ta.focus(); ta.select();
  let ok=false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard){
    navigator.clipboard.writeText(ta.value).then(()=>{ markBackedUp(); showAlert('Kopyalandı.'); }).catch(()=>showAlert('Kopyalanamadı, metni elle seçip kopyalayın.'));
    return;
  }
  if(ok) markBackedUp();
  showAlert(ok? 'Kopyalandı.' : 'Kopyalanamadı, metni elle seçip kopyalayın.');
}
function openTextImportModal(){ textImportOpen=true; render(); }
function closeTextImportModal(){ textImportOpen=false; const o=document.getElementById('textImportOverlay'); if(o) o.remove(); }
function renderTextImportModal(){
  const ex = document.getElementById('textImportOverlay'); if(ex) ex.remove();
  const div = document.createElement('div'); div.id='textImportOverlay'; div.className='overlay';
  div.onclick=(e)=>{ if(e.target===div) closeTextImportModal(); };
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <h3>Metinden geri yükle</h3>
    <p class="empty" style="padding-top:0;">Kaydettiğiniz yedek metnini yapıştırın.</p>
    <textarea id="importTextArea" placeholder='{"version":2,"students":[…]}' style="width:100%;height:150px;font-family:var(--mono);font-size:11px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);"></textarea>
    <div class="modal-actions"><button class="secondary" onclick="closeTextImportModal()">Vazgeç</button><button class="primary" onclick="submitTextImport()">Devam</button></div>
  </div>`;
  document.body.appendChild(div);
}
function submitTextImport(){
  const raw = document.getElementById('importTextArea').value.trim();
  let data;
  try{ data = JSON.parse(raw); }catch(e){ showAlert('Yapıştırılan metin okunamadı.'); return; }
  closeTextImportModal();
  askImportMode(data);
}
function handleImportFile(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let data;
    try{ data = JSON.parse(e.target.result); }catch(err){ showAlert('Yedek dosyası okunamadı.'); evt.target.value=''; return; }
    evt.target.value='';
    askImportMode(data);
  };
  reader.readAsText(file);
}
function askImportMode(data){
  if(!data || !Array.isArray(data.students) || !Array.isArray(data.payments)){ showAlert('Bu dosya geçerli bir yedek değil.'); return; }
  const info = `Yedek içeriği: ${data.students.length} öğrenci, ${data.payments.length} ödeme, ${(data.installments||[]).length} taksit, ${(data.expenses||[]).length} gider, ${(data.otherIncomes||[]).length} diğer gelir.`;
  importPending = data;
  askConfirmCustom('Yedeği geri yükle', info + ' Mevcut verilerin üzerine mi yazılsın, yoksa mevcutla birleştirilsin mi?', [
    {label:'Üzerine yaz', cls:'primary', style:'background:var(--red);color:#fff;', fn:()=>applyImport('replace')},
    {label:'Birleştir', cls:'primary', fn:()=>applyImport('merge')}
  ]);
}
let importPending = null;
function applyImport(mode){
  const data = importPending; if(!data) return;
  const snap = snapshot();
  const inc = {
    students: data.students||[], payments: data.payments||[],
    installments: data.installments||[], expenses: data.expenses||[],
    otherIncomes: data.otherIncomes||[]
  };
  // eski (v1) yedekler: gider kutularını işleme çevir
  if(!data.version && Array.isArray(data.expenses) && data.expenses.length && data.expenses[0].month){
    inc.expenses = data.expenses.map(e=>({id:e.id||uid(), date:(e.month)+'-01', category:e.category, amount:Number(e.amount)||0, desc:'Eski kayıttan aktarıldı', createdAt:e.createdAt}));
  }
  if(mode==='replace'){
    students=inc.students; payments=inc.payments; installments=inc.installments; expenses=inc.expenses; otherIncomes=inc.otherIncomes;
  } else {
    const mergeById = (cur, add)=>{
      const ids = new Set(cur.map(x=>x.id));
      return cur.concat(add.filter(x=>x && !ids.has(x.id)));
    };
    students = mergeById(students, inc.students);
    payments = mergeById(payments, inc.payments);
    installments = mergeById(installments, inc.installments);
    expenses = mergeById(expenses, inc.expenses);
    otherIncomes = mergeById(otherIncomes, inc.otherIncomes);
  }
  if(Array.isArray(data.expenseCats) && data.expenseCats.length){
    const keys = new Set(expenseCats.map(c=>c.key));
    expenseCats = expenseCats.concat(data.expenseCats.filter(c=>!keys.has(c.key)));
    saveList(KEYS.cats, expenseCats);
  }
  saveAll(); importPending=null; render();
  showToast(mode==='replace'? 'Yedek geri yüklendi (üzerine yazıldı).' : 'Yedek mevcut verilerle birleştirildi.', ()=>restoreSnapshot(snap));
}

/* ===================== PIN ===================== */
function hashPin(p){ let h=5381; for(let i=0;i<p.length;i++){ h=((h<<5)+h+p.charCodeAt(i))>>>0; } return 'h'+h; }
function openPinModal(){ pinModalOpen=true; render(); }
function closePinModal(){ pinModalOpen=false; const o=document.getElementById('pinOverlay'); if(o) o.remove(); }
function renderPinModal(){
  const ex = document.getElementById('pinOverlay'); if(ex) ex.remove();
  const div = document.createElement('div'); div.id='pinOverlay'; div.className='overlay';
  div.onclick=(e)=>{ if(e.target===div) closePinModal(); };
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <h3>PIN belirle</h3>
    <div class="field"><label>4 haneli PIN</label><input type="tel" inputmode="numeric" maxlength="4" id="pin1" placeholder="••••"></div>
    <div class="field"><label>Tekrar</label><input type="tel" inputmode="numeric" maxlength="4" id="pin2" placeholder="••••"></div>
    <div class="empty" style="padding-top:0;">PIN’i unutursanız verilere yalnızca yedeğinizden ulaşabilirsiniz. Önce yedek almanız önerilir.</div>
    <div class="modal-actions"><button class="secondary" onclick="closePinModal()">Vazgeç</button><button class="primary" onclick="submitPin()">Kaydet</button></div>
  </div>`;
  document.body.appendChild(div);
}
function submitPin(){
  const a = document.getElementById('pin1').value.trim(), b = document.getElementById('pin2').value.trim();
  if(!/^\d{4}$/.test(a)){ showAlert('4 haneli bir sayı girin.'); return; }
  if(a!==b){ showAlert('İki PIN aynı değil.'); return; }
  meta.pin = hashPin(a); saveMeta(); closePinModal(); render();
}
function removePin(){
  askConfirm('Uygulama kilidi kaldırılacak.', ()=>{ meta.pin=null; saveMeta(); render(); });
}
function renderLock(){
  document.getElementById('app').innerHTML = `
  <div style="max-width:320px;margin:18vh auto 0;text-align:center;">
    <div class="eyebrow" style="display:inline-block;font-size:11px;color:#fff;background:var(--red);padding:4px 11px;border-radius:999px;font-weight:800;">Kilitli</div>
    <h1 style="font-size:20px;margin:10px 0 18px;">Ödeme Takip Sistemi</h1>
    <input type="tel" inputmode="numeric" maxlength="4" id="lockPin" placeholder="••••"
      style="width:100%;text-align:center;letter-spacing:12px;font-size:26px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;"
      onkeydown="if(event.key==='Enter'){tryUnlock()}" oninput="if(this.value.length===4) tryUnlock()">
    <button class="primary" style="width:100%;margin-top:12px;" onclick="tryUnlock()">Aç</button>
    <div id="lockMsg" style="color:var(--red);font-size:12.5px;font-weight:700;margin-top:10px;"></div>
  </div>`;
  setTimeout(()=>{ const el=document.getElementById('lockPin'); if(el) el.focus(); },60);
}
function tryUnlock(){
  const v = document.getElementById('lockPin').value.trim();
  if(hashPin(v)===meta.pin){ locked=false; render(); return; }
  if(v.length>=4){
    document.getElementById('lockMsg').textContent = 'PIN hatalı.';
    document.getElementById('lockPin').value='';
  }
}

/* ===================== confirm / alert ===================== */
function askConfirm(message, action){ confirmState = {message, action, buttons:null}; render(); }
function askConfirmCustom(title, message, buttons){ confirmState = {title, message, buttons}; render(); }
function cancelConfirm(){ confirmState=null; importPending=null; const o=document.getElementById('confirmOverlay'); if(o) o.remove(); }
function confirmYes(){
  const act = confirmState && confirmState.action;
  confirmState=null; const o=document.getElementById('confirmOverlay'); if(o) o.remove();
  if(act) act();
}
function confirmBtn(idx){
  const b = confirmState && confirmState.buttons && confirmState.buttons[idx];
  confirmState=null; const o=document.getElementById('confirmOverlay'); if(o) o.remove();
  if(b && b.fn) b.fn();
}
function renderConfirmModal(){
  const ex = document.getElementById('confirmOverlay'); if(ex) ex.remove();
  if(!confirmState) return;
  const div = document.createElement('div'); div.id='confirmOverlay'; div.className='overlay';
  div.onclick=(e)=>{ if(e.target===div) cancelConfirm(); };
  const actions = confirmState.buttons
    ? confirmState.buttons.map((b,i)=>`<button class="${b.cls||'secondary'}" style="${b.style||''}" onclick="confirmBtn(${i})">${esc(b.label)}</button>`).join('')
    : `<button class="secondary" onclick="cancelConfirm()">Vazgeç</button><button class="primary" style="background:var(--red);" onclick="confirmYes()">Evet, sil</button>`;
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <h3>${esc(confirmState.title || 'Emin misiniz?')}</h3>
    <p style="font-size:13px;color:var(--muted);margin:0;line-height:1.5;font-weight:600;">${confirmState.message}</p>
    <div class="modal-actions">${confirmState.buttons? `<button class="secondary" onclick="cancelConfirm()">Vazgeç</button>`:''}${actions}</div>
  </div>`;
  document.body.appendChild(div);
}
function showAlert(msg){ alertState = msg; render(); }
function closeAlert(){ alertState=null; const o=document.getElementById('alertOverlay'); if(o) o.remove(); }
function renderAlertModal(){
  const ex = document.getElementById('alertOverlay'); if(ex) ex.remove();
  if(!alertState) return;
  const div = document.createElement('div'); div.id='alertOverlay'; div.className='overlay';
  div.onclick=(e)=>{ if(e.target===div) closeAlert(); };
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <p style="font-size:13.5px;margin:0 0 12px;line-height:1.5;font-weight:600;">${esc(alertState)}</p>
    <div class="modal-actions"><button class="primary" onclick="closeAlert()">Tamam</button></div>
  </div>`;
  document.body.appendChild(div);
}

loadAll();
</script>
